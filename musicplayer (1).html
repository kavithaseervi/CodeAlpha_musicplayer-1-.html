<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CodeAlpha | Music Player</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&family=Bebas+Neue&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --card: #13131c;
      --card2: #1a1a28;
      --accent: #a855f7;
      --accent2: #ec4899;
      --accent3: #06b6d4;
      --text: #f0eeff;
      --muted: #6b6b8a;
      --border: #22223a;
      --radius: 20px;
    }

    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Nunito', sans-serif;
      padding: 20px;
      color: var(--text);
    }

    /* background blobs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 400px; height: 400px;
      background: var(--accent);
      top: -100px; left: -100px;
    }
    body::after {
      width: 350px; height: 350px;
      background: var(--accent2);
      bottom: -80px; right: -80px;
    }

    .app {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .page-label {
      text-align: center;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* PLAYER CARD */
    .player-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: 0 40px 80px rgba(0,0,0,0.5);
    }

    /* ALBUM ART */
    .art-wrap {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 16px;
      margin-bottom: 28px;
      position: relative;
      overflow: hidden;
    }

    .art-bg {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5rem;
      transition: background 0.5s ease;
      border-radius: 16px;
    }

    .art-bg.playing {
      animation: pulse-art 2s ease-in-out infinite;
    }

    @keyframes pulse-art {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    /* vinyl ring */
    .art-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 16px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
      pointer-events: none;
    }

    /* SONG INFO */
    .song-info {
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .song-text { flex: 1; min-width: 0; }

    #song-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem;
      letter-spacing: 0.04em;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.1;
    }

    #song-artist {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .like-btn {
      background: none;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      transition: transform 0.2s ease;
      padding: 6px;
      flex-shrink: 0;
    }
    .like-btn:hover { transform: scale(1.3); }
    .like-btn.liked { animation: heartPop 0.3s ease; }
    @keyframes heartPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.5); }
      100% { transform: scale(1); }
    }

    /* PROGRESS */
    .progress-wrap {
      margin-bottom: 18px;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 8px;
      font-variant-numeric: tabular-nums;
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      width: 0%;
      transition: width 0.1s linear;
      position: relative;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      right: -5px; top: 50%;
      transform: translateY(-50%);
      width: 12px; height: 12px;
      background: #fff;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.2s;
      box-shadow: 0 0 6px rgba(168,85,247,0.6);
    }

    .progress-bar:hover .progress-fill::after { opacity: 1; }

    /* CONTROLS */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      transition: color 0.2s, transform 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ctrl-btn:hover { color: var(--text); transform: scale(1.15); }
    .ctrl-btn.active { color: var(--accent); }

    .play-btn {
      width: 60px; height: 60px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 50%;
      color: #fff;
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 8px 24px rgba(168,85,247,0.4);
      flex-shrink: 0;
    }

    .play-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 12px 32px rgba(168,85,247,0.6);
    }

    .play-btn:active { transform: scale(0.95); }

    /* VOLUME */
    .volume-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .vol-icon {
      font-size: 1rem;
      color: var(--muted);
      flex-shrink: 0;
      width: 20px;
      text-align: center;
    }

    input[type=range] {
      -webkit-appearance: none;
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: var(--border);
      outline: none;
      cursor: pointer;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      cursor: pointer;
      box-shadow: 0 0 6px rgba(168,85,247,0.5);
    }

    .vol-pct {
      font-size: 0.72rem;
      color: var(--muted);
      width: 30px;
      text-align: right;
    }

    /* PLAYLIST */
    .playlist-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .playlist-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .playlist {
      max-height: 240px;
      overflow-y: auto;
    }

    .playlist::-webkit-scrollbar { width: 3px; }
    .playlist::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .pl-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 20px;
      cursor: pointer;
      border-bottom: 1px solid rgba(34,34,58,0.5);
      transition: background 0.2s;
    }

    .pl-item:last-child { border-bottom: none; }
    .pl-item:hover { background: var(--card2); }
    .pl-item.active { background: rgba(168,85,247,0.08); }

    .pl-num {
      font-size: 0.72rem;
      color: var(--muted);
      width: 18px;
      text-align: center;
      flex-shrink: 0;
    }

    .pl-item.active .pl-num {
      color: var(--accent);
    }

    .pl-art {
      font-size: 1.5rem;
      width: 36px; height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .pl-info { flex: 1; min-width: 0; }

    .pl-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pl-item.active .pl-title { color: var(--accent); }

    .pl-artist {
      font-size: 0.72rem;
      color: var(--muted);
    }

    .pl-duration {
      font-size: 0.72rem;
      color: var(--muted);
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .pl-playing {
      display: none;
      align-items: center;
      gap: 2px;
    }

    .pl-item.active .pl-playing { display: flex; }
    .pl-item.active .pl-num-static { display: none; }

    .bar-anim {
      width: 3px;
      border-radius: 2px;
      background: var(--accent);
      animation: bar 0.8s ease-in-out infinite alternate;
    }
    .bar-anim:nth-child(2) { animation-delay: 0.2s; height: 10px; }
    .bar-anim:nth-child(3) { animation-delay: 0.4s; height: 6px; }

    @keyframes bar {
      from { height: 4px; }
      to { height: 14px; }
    }

    .paused .bar-anim { animation-play-state: paused; }

    /* responsive */
    @media (max-width: 460px) {
      .player-card { padding: 20px; }
      #song-title { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

<div class="app">
  <div class="page-label">CodeAlpha — Task 4</div>

  <!-- PLAYER -->
  <div class="player-card">

    <!-- Art -->
    <div class="art-wrap">
      <div class="art-bg" id="art-bg">🎵</div>
    </div>

    <!-- Song Info -->
    <div class="song-info">
      <div class="song-text">
        <div id="song-title">Select a Song</div>
        <div id="song-artist">— Artist —</div>
      </div>
      <button class="like-btn" id="like-btn" title="Like">🤍</button>
    </div>

    <!-- Progress -->
    <div class="progress-wrap">
      <div class="time-row">
        <span id="current-time">0:00</span>
        <span id="duration">0:00</span>
      </div>
      <div class="progress-bar" id="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn" id="shuffle-btn" title="Shuffle">🔀</button>
      <button class="ctrl-btn" id="prev-btn" title="Previous">⏮</button>
      <button class="play-btn" id="play-btn" title="Play/Pause">▶</button>
      <button class="ctrl-btn" id="next-btn" title="Next">⏭</button>
      <button class="ctrl-btn" id="repeat-btn" title="Repeat">🔁</button>
    </div>

    <!-- Volume -->
    <div class="volume-row">
      <div class="vol-icon" id="vol-icon">🔊</div>
      <input type="range" id="volume" min="0" max="100" value="70"/>
      <div class="vol-pct" id="vol-pct">70%</div>
    </div>

  </div>

  <!-- PLAYLIST -->
  <div class="playlist-card">
    <div class="playlist-header">Up Next — Playlist</div>
    <div class="playlist" id="playlist"></div>
  </div>

</div>

<script>
  // Songs — using free audio from different sources
  const songs = [
    {
      title: 'Agar Tum Saath Ho',
      artist: 'Arijit Singh & Alka Yagnik',
      emoji: '❤️',
      bg: 'linear-gradient(135deg, #7f1d1d, #dc2626)',
      duration: 298,
      src: 'song1.mp3'
    },
    {
      title: 'Kadalalle',
      artist: 'Sid Sriram & Aishwarya Ravichandran',
      emoji: '🌊',
      bg: 'linear-gradient(135deg, #0c4a6e, #0891b2)',
      duration: 260,
      src: 'song2.mp3'
    },
    {
      title: 'Paar Chana De',
      artist: 'Shilpa Rao & Noori',
      emoji: '🌾',
      bg: 'linear-gradient(135deg, #713f12, #d97706)',
      duration: 302,
      src: 'song3.mp3'
    },
    {
      title: 'Kun Faya Kun',
      artist: 'A.R. Rahman, Javed Ali & Mohit Chauhan',
      emoji: '🕌',
      bg: 'linear-gradient(135deg, #1e3a5f, #2563eb)',
      duration: 428,
      src: 'song4.mp3'
    },
    {
      title: 'Munjane Manjalli',
      artist: 'Raghu Dixit',
      emoji: '🌅',
      bg: 'linear-gradient(135deg, #064e3b, #10b981)',
      duration: 340,
      src: 'song5.mp3'
    },
  ];

  let currentIdx = 0;
  let isPlaying = false;
  let isShuffle = false;
  let isRepeat = false;
  let liked = new Set();
  let audio = new Audio();
  let fakeTimer = null;
  let fakeProgress = 0;

  const playBtn = document.getElementById('play-btn');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');
  const shuffleBtn = document.getElementById('shuffle-btn');
  const repeatBtn = document.getElementById('repeat-btn');
  const likeBtn = document.getElementById('like-btn');
  const progressBar = document.getElementById('progress-bar');
  const progressFill = document.getElementById('progress-fill');
  const currentTimeEl = document.getElementById('current-time');
  const durationEl = document.getElementById('duration');
  const volumeInput = document.getElementById('volume');
  const volPct = document.getElementById('vol-pct');
  const volIcon = document.getElementById('vol-icon');
  const artBg = document.getElementById('art-bg');
  const songTitle = document.getElementById('song-title');
  const songArtist = document.getElementById('song-artist');
  const playlistEl = document.getElementById('playlist');

  function fmt(s) {
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return `${m}:${sec.toString().padStart(2, '0')}`;
  }

  function loadSong(idx) {
    const song = songs[idx];
    currentIdx = idx;
    fakeProgress = 0;

    songTitle.textContent = song.title;
    songArtist.textContent = song.artist;
    artBg.textContent = song.emoji;
    artBg.style.background = song.bg;
    durationEl.textContent = fmt(song.duration);
    currentTimeEl.textContent = '0:00';
    progressFill.style.width = '0%';

    likeBtn.textContent = liked.has(idx) ? '❤️' : '🤍';

    // try real audio
    audio.pause();
    audio.src = song.src;
    audio.volume = volumeInput.value / 100;
    audio.load();

    updatePlaylist();
  }

  function startFakeProgress() {
    clearInterval(fakeTimer);
    const song = songs[currentIdx];
    fakeTimer = setInterval(() => {
      if (!isPlaying) return;
      fakeProgress += 1;
      if (fakeProgress >= song.duration) {
        fakeProgress = 0;
        handleEnded();
        return;
      }
      currentTimeEl.textContent = fmt(fakeProgress);
      progressFill.style.width = (fakeProgress / song.duration * 100) + '%';
    }, 1000);
  }

  function play() {
    isPlaying = true;
    playBtn.textContent = '⏸';
    artBg.classList.add('playing');
    updatePlaylist();

    const tryAudio = audio.play();
    if (tryAudio !== undefined) {
      tryAudio.then(() => {
        // real audio works
        audio.addEventListener('timeupdate', onTimeUpdate);
        audio.addEventListener('ended', handleEnded);
      }).catch(() => {
        // fallback to fake timer
        startFakeProgress();
      });
    } else {
      startFakeProgress();
    }
  }

  function pause() {
    isPlaying = false;
    playBtn.textContent = '▶';
    artBg.classList.remove('playing');
    audio.pause();
    clearInterval(fakeTimer);
    updatePlaylist();
  }

  function onTimeUpdate() {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    progressFill.style.width = pct + '%';
    currentTimeEl.textContent = fmt(audio.currentTime);
    durationEl.textContent = fmt(audio.duration);
  }

  function handleEnded() {
    if (isRepeat) {
      fakeProgress = 0;
      audio.currentTime = 0;
      play();
    } else {
      nextSong();
    }
  }

  function nextSong() {
    let idx;
    if (isShuffle) {
      do { idx = Math.floor(Math.random() * songs.length); } while (idx === currentIdx && songs.length > 1);
    } else {
      idx = (currentIdx + 1) % songs.length;
    }
    loadSong(idx);
    if (isPlaying) play();
  }

  function prevSong() {
    if (fakeProgress > 3 || (audio.currentTime && audio.currentTime > 3)) {
      fakeProgress = 0;
      audio.currentTime = 0;
      currentTimeEl.textContent = '0:00';
      progressFill.style.width = '0%';
      return;
    }
    const idx = (currentIdx - 1 + songs.length) % songs.length;
    loadSong(idx);
    if (isPlaying) play();
  }

  // Playlist render
  function updatePlaylist() {
    playlistEl.innerHTML = '';
    songs.forEach((s, i) => {
      const item = document.createElement('div');
      item.className = 'pl-item' + (i === currentIdx ? ' active' : '');
      item.innerHTML = `
        <div class="pl-num">
          <span class="pl-num-static">${i + 1}</span>
          <div class="pl-playing ${!isPlaying ? 'paused' : ''}">
            <div class="bar-anim" style="height:8px"></div>
            <div class="bar-anim"></div>
            <div class="bar-anim" style="height:6px"></div>
          </div>
        </div>
        <div class="pl-art" style="background:${s.bg.replace('135deg,','90deg,')}">${s.emoji}</div>
        <div class="pl-info">
          <div class="pl-title">${s.title}</div>
          <div class="pl-artist">${s.artist}</div>
        </div>
        <div class="pl-duration">${fmt(s.duration)}</div>
      `;
      item.addEventListener('click', () => {
        loadSong(i);
        play();
      });
      playlistEl.appendChild(item);
    });

    // scroll active into view
    const activeItem = playlistEl.querySelector('.pl-item.active');
    if (activeItem) activeItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  // Events
  playBtn.addEventListener('click', () => isPlaying ? pause() : play());

  nextBtn.addEventListener('click', () => { nextSong(); });
  prevBtn.addEventListener('click', () => { prevSong(); });

  shuffleBtn.addEventListener('click', () => {
    isShuffle = !isShuffle;
    shuffleBtn.classList.toggle('active', isShuffle);
  });

  repeatBtn.addEventListener('click', () => {
    isRepeat = !isRepeat;
    repeatBtn.classList.toggle('active', isRepeat);
  });

  likeBtn.addEventListener('click', () => {
    if (liked.has(currentIdx)) {
      liked.delete(currentIdx);
      likeBtn.textContent = '🤍';
    } else {
      liked.add(currentIdx);
      likeBtn.textContent = '❤️';
      likeBtn.classList.add('liked');
      setTimeout(() => likeBtn.classList.remove('liked'), 300);
    }
  });

  // Progress click to seek
  progressBar.addEventListener('click', e => {
    const rect = progressBar.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    const song = songs[currentIdx];
    fakeProgress = Math.floor(pct * song.duration);
    progressFill.style.width = (pct * 100) + '%';
    currentTimeEl.textContent = fmt(fakeProgress);
    if (audio.duration) audio.currentTime = pct * audio.duration;
  });

  // Volume
  volumeInput.addEventListener('input', () => {
    const v = volumeInput.value;
    audio.volume = v / 100;
    volPct.textContent = v + '%';
    volIcon.textContent = v == 0 ? '🔇' : v < 40 ? '🔉' : '🔊';
    // update range track fill
    volumeInput.style.background = `linear-gradient(90deg, var(--accent) ${v}%, var(--border) ${v}%)`;
  });

  // init
  volumeInput.style.background = `linear-gradient(90deg, var(--accent) 70%, var(--border) 70%)`;
  loadSong(0);
</script>
</body>
</html>
